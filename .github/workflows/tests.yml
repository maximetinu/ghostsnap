name: tests
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: "3.13"
          - os: macos-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Unit tests
        run: uv run --no-project --python ${{ matrix.python }} python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          uv run --no-project --python ${{ matrix.python }} python ghostsnap.py --help
          GHOSTSNAP_DIR="$RUNNER_TEMP/gs" uv run --no-project --python ${{ matrix.python }} python ghostsnap.py list --json
